# =============================================================
#  project.conf — central configuration (edit values here only)
# =============================================================
PROJECT_NAME="Linux-Based Heart Rate Data Monitoring and Analysis System"
PROJECT_VERSION="1.0.0"
COURSE="Engineering Linux — Continuous Assessment 01"
PATIENT_ID="P-001"

# --- Data collection ------------------------------------------
SAMPLE_COUNT=120          # number of readings generated per run
SAMPLE_INTERVAL_SEC=1     # seconds between simulated readings

# --- Monitoring thresholds (beats per minute) -----------------
MIN_BPM=60                # below this  -> WARNING
MAX_BPM=100               # above this  -> WARNING
CRITICAL_LOW=45           # at/below    -> CRITICAL
CRITICAL_HIGH=140         # at/above    -> CRITICAL

# --- Data validation (physiologically possible range) ---------
VALID_MIN=20
VALID_MAX=250

# --- Misc -----------------------------------------------------
REPLAY_DELAY=0.03         # seconds per line in live monitor view
KEEP_BACKUPS=5            # how many backup archives to keep
